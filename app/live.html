<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ao vivo · BJJ Arena</title>
<style>
:root{--bg:#070B0E;--s:#0F171C;--s2:#16212A;--line:#24343E;--fg:#EEF3F5;--mut:#93A2AC;--gold:#F2BF3C;--red:#FF5A4D;--ok:#5FD3B0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 85% -10%,#1b2a33,transparent 60%),var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 60px}
.w{max-width:760px;margin:0 auto}.eb{letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
h1{font:800 clamp(1.9rem,8vw,2.8rem)/1 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;margin:.3rem 0 1rem}
nav{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
nav button{flex:1;background:var(--s);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:11px 6px;font:700 .9rem system-ui;cursor:pointer}nav button.on{background:var(--gold);color:#1a1203;border-color:var(--gold)}
.card{background:var(--s);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mh{font:800 1.3rem 'Barlow Condensed','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;display:flex;justify-content:space-between}.mh small{color:var(--mut);font:600 .8rem system-ui}
.f{border-top:1px solid var(--line);padding:10px 0}.f:first-of-type{border-top:0}.cat{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:4px}.vs b{display:block;font-size:1.05rem}.vs small{color:var(--mut)}.vs .r{text-align:right}.vs i{font:800 .9rem system-ui;color:var(--gold);font-style:normal}
.sc{font:800 1.5rem 'Barlow Condensed',Arial,sans-serif}.tag{display:inline-block;font-size:.7rem;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--red);color:#fff;text-transform:uppercase;margin-right:6px}.tag.n{background:var(--gold);color:#1a1203}
.bar{height:6px;background:var(--s2);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.pod div{display:flex;gap:8px;align-items:baseline;margin-top:4px}.pod span{font:800 1rem system-ui;width:1.6em}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.7rem;color:var(--mut);text-transform:uppercase}td.n,th.n{text-align:right}
.mut{color:var(--mut)}.empty{text-align:center;padding:40px 10px;color:var(--mut)}
</style>
</head>
<body>
<div class="w">
  <div class="eb"><i class="dot"></i>Ao vivo · BJJ Arena</div>
  <h1 id="nome">Carregando…</h1>
  <nav id="nav"><button data-t="agora" class="on">Agora</button><button data-t="chaves">Categorias</button><button data-t="equipes">Equipes</button></nav>
  <div id="c"></div>
  <p class="mut" id="up" style="text-align:center;font-size:.8rem"></p>
</div>
<script>
(function(){
  var TAB='agora',D=null;
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function side(x,r){return '<div class="'+(r?'r':'')+'"><b>'+esc(x.name)+'</b><small>'+esc(x.team)+'</small></div>'}
  function fight(f,live){
    return '<div class="f"><div class="cat">'+(live?'<span class="tag">Em luta</span>':'')+esc(f.cat)+' · '+esc(f.stage)+' · Luta '+f.num+'</div>'+
      '<div class="vs">'+side(f.a)+'<i>VS</i>'+side(f.b,1)+'</div>'+
      (live?'<div class="vs"><span class="sc">'+f.sc.a.p+'</span><small class="mut" style="text-align:center">V '+f.sc.a.v+'-'+f.sc.b.v+' · P '+f.sc.a.u+'-'+f.sc.b.u+'</small><span class="sc" style="text-align:right">'+f.sc.b.p+'</span></div>':'')+'</div>';
  }
  function view(){
    var c=document.getElementById('c');
    if(!D||D.vazio){document.getElementById('nome').textContent=(D&&D.nome)||'BJJ Arena';c.innerHTML='<div class="empty">As chaves ainda não foram geradas.<br>Volte em instantes.</div>';return}
    document.getElementById('nome').textContent=D.nome||'Campeonato';
    var h='';
    if(TAB==='agora'){
      D.mats.forEach(function(m){
        h+='<section class="card"><h3 class="mh">Tatame '+m.mat+'<small>'+m.left+(m.left===1?' luta restante':' lutas restantes')+'</small></h3>';
        if(!m.live.length&&!m.next.length)h+='<p class="mut">Sem lutas pendentes.</p>';
        m.live.forEach(function(f){h+=fight(f,true)});
        m.next.forEach(function(f,i){h+=(i===0&&!m.live.length?'<div class="cat" style="margin-top:6px"><span class="tag n">Próxima</span></div>':'')+fight(f,false)});
        h+='</section>';
      });
    }else if(TAB==='chaves'){
      D.brackets.forEach(function(b){
        var pct=b.total?Math.round(b.done*100/b.total):100;
        h+='<section class="card"><h3 class="mh">'+esc(b.short)+'<small>Tatame '+b.mat+'</small></h3><div class="cat">'+esc(b.sub)+' · '+b.done+'/'+b.total+' lutas</div><div class="bar"><i style="width:'+pct+'%"></i></div>';
        if(b.pod)h+='<div class="pod"><div><span>🥇</span><b>'+esc(b.pod.gold.name)+'</b><small class="mut">'+esc(b.pod.gold.team)+'</small></div>'+(b.pod.silver?'<div><span>🥈</span><b>'+esc(b.pod.silver.name)+'</b><small class="mut">'+esc(b.pod.silver.team)+'</small></div>':'')+b.pod.bronze.map(function(x){return '<div><span>🥉</span><b>'+esc(x.name)+'</b><small class="mut">'+esc(x.team)+'</small></div>'}).join('')+'</div>';
        h+='</section>';
      });
    }else{
      h+='<section class="card"><h3 class="mh">Quadro de medalhas<small>Ouro 9 · Prata 3 · Bronze 1</small></h3>';
      h+=D.teams.length?'<table><thead><tr><th>#</th><th>Equipe</th><th class="n">🥇</th><th class="n">🥈</th><th class="n">🥉</th><th class="n">Pts</th></tr></thead><tbody>'+D.teams.map(function(t,i){return '<tr><td>'+(i+1)+'º</td><td><b>'+esc(t.team)+'</b></td><td class="n">'+t.g+'</td><td class="n">'+t.s+'</td><td class="n">'+t.b+'</td><td class="n"><b>'+t.pts+'</b></td></tr>'}).join('')+'</tbody></table>':'<p class="mut">Nenhuma medalha distribuída ainda.</p>';
      h+='</section>';
    }
    c.innerHTML=h;
  }
  function tick(){
    fetch('/live.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
      D=j;view();
      document.getElementById('up').textContent='Atualiza sozinho · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }).catch(function(){document.getElementById('up').textContent='Sem conexão com o computador do evento…'}).then(function(){setTimeout(tick,3000)});
  }
  document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;TAB=b.getAttribute('data-t');[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b)});view()});
  tick();
})();
</script>
</body>
</html>
